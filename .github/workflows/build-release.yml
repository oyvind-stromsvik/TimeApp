name: Build macOS App and create release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Allow manual triggering

jobs:
  build_and_release:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Build the app using Xcode
      - name: Build Release scheme
        run: |
          echo "Building Release scheme..."
          xcodebuild clean build analyze \
            -project "Time.xcodeproj" \
            -scheme "Release" \
            -configuration Release \
            -destination "platform=macOS" \
            | xcpretty && exit ${PIPESTATUS[0]}

      # 3️⃣ Package the .app into a .zip and save path to env
      - name: Package .app into ZIP
        run: |
          echo "Locating Time.app..."
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/ -type d -name "Time.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Time.app not found!"
            exit 1
          fi
          ZIP_PATH="${APP_PATH%/*}/Time.app.zip"
          cd $(dirname "$APP_PATH")
          zip -r Time.app.zip Time.app
          echo "Packaged $APP_PATH into $ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      # 4️⃣ Create GitHub Release with a unique tag
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Release v${{ github.run_number }}"
          body: "Automated release built from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Upload the .zip as an asset to the release
      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_PATH }}
          tag_name: ${{ steps.create_release.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
