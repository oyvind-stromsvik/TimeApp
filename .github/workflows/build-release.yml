name: Build macOS App and create release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # Allow manual triggering

jobs:
  build_and_release:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Read app version from project.pbxproj
      - name: Get app version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' Time.xcodeproj/project.pbxproj | sed 's/.*= //; s/;//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "App version is $VERSION"

      # 3️⃣ Build the app using Xcode
      - name: Build Release scheme
        run: |
          echo "Building Release scheme..."
          xcodebuild clean build analyze \
            -project "Time.xcodeproj" \
            -scheme "Release" \
            -configuration Release \
            -destination "platform=macOS" \
            | xcpretty && exit ${PIPESTATUS[0]}

      # 4️⃣ Package the .app into a .zip inside the repo folder
      - name: Package .app into ZIP
        run: |
          echo "Locating Time.app..."
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/ -type d -name "Time.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Time.app not found!"
            exit 1
          fi
          # Copy .app into repo folder
          cp -R "$APP_PATH" .
          # Zip it
          zip -r Time.app.zip Time.app
          echo "Packaged $APP_PATH into Time.app.zip"
          # Save path for the release step
          echo "ZIP_PATH=Time.app.zip" >> $GITHUB_ENV

      # 5️⃣ Create GitHub Release AND upload ZIP in one step
      - name: Create GitHub Release with ZIP
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Release ${{ env.APP_VERSION }}"
          body: "Automated release built from commit ${{ github.sha }}"
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
