name: Build (Release)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release scheme
        run: |
          xcodebuild clean build analyze \
            -project "Time.xcodeproj" \
            -scheme "Release" \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64,arch=arm64" \
            | xcpretty && exit ${PIPESTATUS[0]}